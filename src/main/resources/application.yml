server:
  port: 8080

spring:
  # 本地开发凭据放在 application-local.yml（已 gitignore，不进仓库）
  # 该文件不存在时回落到下面的默认值，克隆仓库的人改成自己的即可
  config:
    import: optional:classpath:application-local.yml

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/lost_found?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      # 默认值是 10。压测实测：50 并发下 10 个连接**够用** ——
      # 调到 50 后 QPS 124.5 → 124.3、平均响应 299ms → 299ms，没有任何变化。
      # 原因：124 QPS × 单请求 77ms 的 SQL ≈ 9.5 个连接，10 个正好覆盖。
      #
      # 保留 50 是给更高吞吐的工作点留余量（并发梯度里 25 并发能跑到 252 QPS）。
      # ⚠️ 但「25 并发下 10 个够不够」没有单独复测过，属于未经验证的推断 ——
      # 别把留余量说成优化成果。完整数据见 bench/REPORT.md 第五节。
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 3000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Redis 缓存
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8        # 最多同时 8 个连接
          max-idle: 8          # 空闲时保留 8 个
          min-idle: 0          # 最少空闲（0 表示不保留）

  cache:
    type: redis
    redis:
      time-to-live: 300000    # 默认缓存 5 分钟（毫秒）

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath:mapper/*.xml

# JWT 配置
jwt:
  # ⚠️ 这里**故意不提供默认密钥**。
  #
  #    以前这里写了一个硬编码的兜底值，那是错的：密钥一旦进了公开仓库，
  #    任何人都能用它签出一个合法 token —— 等于认证形同虚设。
  #    现在留空，应用会在启动时**直接失败**并告诉你怎么配（JwtConfig#validateSecret）。
  #
  #    怎么配：
  #      · 生产/CI：环境变量 JWT_SECRET（至少 32 字节）
  #      · 本地开发：写在 application-local.yml（已 gitignore）里，`jwt.secret: <你的密钥>`
  #        —— 它被本文件用 spring.config.import 自动加载，与 profile 无关
  #      · 自动化测试：src/test/resources/application.properties 里有一份仅测试用的
  secret: "${JWT_SECRET:}"
  expire-days: 7

# 日志
logging:
  level:
    com.lostfound: debug

# 大模型配置 —— 都是 OpenAI 兼容接口，换供应商只改下面三项，代码不动
llm:
  # 切供应商的方式（启动后端前设环境变量）：
  #   DeepSeek（当前）  无需设置，用默认值
  #   硅基流动（免费）   LLM_API_URL=https://api.siliconflow.cn/v1/chat/completions
  #                     LLM_MODEL=Qwen/Qwen2.5-7B-Instruct
  #                     LLM_API_KEY=sk-xxx
  api-url: ${LLM_API_URL:https://api.deepseek.com/v1/chat/completions}
  # 兼容旧的环境变量名，之前只在环境里配了 DEEPSEEK_API_KEY
  api-key: ${LLM_API_KEY:${DEEPSEEK_API_KEY:}}
  # ⚠️ 这里刻意用 deepseek-chat（已弃用的别名），而不是官方 /v1/models 返回的 deepseek-flash。
  #
  #    踩过的坑：deepseek-chat 这个别名会被映射到 deepseek-v4-flash 的
  #    **非思考模式**，而直接用 deepseek-flash 会走**思考模式** ——
  #    模型先"想"再"答"，推理 token 和输出 token 共用 max-tokens 额度。
  #    实测 max-tokens=500 时，500 个额度全被推理吃掉（reasoning_tokens=500），
  #    输出为空字符串，整个匹配接口返回空结果；调到 3000 才正常，
  #    但每次多烧 187~645 个推理 token，耗时从 1.5s 涨到 3.6s。
  #
  #    教训：「已弃用」不等于「该立刻换掉」。换之前要验证，
  #    否则修掉一个警告、引入一个 bug。
  model: ${LLM_MODEL:deepseek-chat}
  connect-timeout: 3
  read-timeout: 30
  max-tokens: 500
  # 调用失败时的重试次数（不含首次）。
  # 免费档有偶发长尾延迟（少数请求挂死超过 30 秒读超时），
  # 实测降级率在 1.4%~32.2% 之间波动，重试能救回绝大部分。
  # 只重试可恢复的错误（超时/5xx/429），401/400 这类配置错误不重试。
  max-retries: ${LLM_MAX_RETRIES:2}

# 向量化配置 —— 语义召回用（P3）
#
# 独立于上面的 llm 段：可能不是同一家供应商，超时特征也完全不同
# （对话要 30 秒读超时，向量接口实测 200~300ms 就回来了）。
embedding:
  # cloud = 调云端 API；local = 本地 ONNX 模型（P5，尚未实现）
  provider: ${EMBEDDING_PROVIDER:cloud}
  api-url: ${EMBEDDING_API_URL:https://api.siliconflow.cn/v1/embeddings}
  api-key: ${EMBEDDING_API_KEY:${SILICONFLOW_API_KEY:}}
  # bge-m3：免费档、1024 维、中文效果好。改模型必须同步改下面的 dimension，
  # 否则启动后所有向量化都会因为维度校验失败而返回 null（日志里有明确报错）。
  model: ${EMBEDDING_MODEL:BAAI/bge-m3}
  # 探针实测值，不是查文档抄的：eval/probe-embedding.js
  dimension: 1024
  # 探针实测一次 64 条 258ms（约 4ms/条），比单条调用快 55 倍
  batch-size: 64
  connect-timeout: 3
  # 比大模型的 30 秒短：向量是"算一下"不是"生成一段文字"，挂到 10 秒还没响应的多半不会好了
  read-timeout: 10
  max-retries: ${EMBEDDING_MAX_RETRIES:2}

# 向量库配置 —— 自托管 Qdrant（本机 Docker），存 FOUND 物品向量
#
# 和 embedding 段分开：向量化（调云端）和向量库（本机服务）是两个独立下游，
# 一个挂了另一个还能干活 —— Qdrant 不可达时查询侧直接回退 2-gram，
# 聊天找物照常工作。混成一段会让两边的开关和超时互相牵连。
qdrant:
  # 总开关：false = 所有向量读写直接不可用（等价于关掉混合召回的向量腿），
  # 调用方按"向量不可用"回退，日志里看得见。
  enabled: ${QDRANT_ENABLED:true}

  # 服务地址（不含路径）。容器内访问用 http://qdrant:6333
  base-url: ${QDRANT_URL:http://127.0.0.1:6333}

  # ⚠️ 集合名 = 模型的身份。换了 embedding.model 就**必须换集合名重建**
  #    （向量维度/语义空间不同，混在一起比较没有意义）——
  #    点里存着 model+dimension 哨兵，模型对不上会在启动补齐时直接报错，不会静默混用。
  collection: ${QDRANT_COLLECTION:lost_found_items}

  # 超时单位是毫秒，且刻意很短：Qdrant 是本机服务，正常个位数毫秒返回。
  # 给它 3 秒意味着"Qdrant 卡死"时每次找物对话都要白等 3 秒才回退 ——
  # 回退必须立刻发生，否则「有向量加速」在故障时反而变成「比纯 2-gram 更慢」。
  connect-timeout-ms: ${QDRANT_CONNECT_TIMEOUT_MS:500}
  read-timeout-ms: ${QDRANT_READ_TIMEOUT_MS:2000}

# 限流配置
rate-limit:
  ai:
    # 每个用户每分钟允许调用 AI 接口的次数。
    # 生产 5 次/分钟够用；跑评测或压测时要调高，否则批量请求会被自己的限流挡回去。
    # 调高方式：启动后端前设置环境变量 RATE_LIMIT_AI_MAX_REQUESTS=1000
    max-requests: ${RATE_LIMIT_AI_MAX_REQUESTS:5}

# AI 匹配配置
ai:
  recall:
    # 召回后送进大模型的候选条数。
    # 调小了召回不够（候选池里的物品进不来），调大了 token 上去、干扰项也变多。
    # 改这个值必须重跑评测 —— 它直接决定命中率和成本。
    top-k: ${AI_RECALL_TOP_K:50}

  # 向量检索（混合召回）—— 只作用于**聊天找物入口**。
  #
  # 关掉它，找物助手完全回到改造前的 2-gram 行为（一条向量调用都不会发）；
  # 发布后的自动匹配本来就不用它，不受这个开关影响。
  vector:

    # 混合召回总开关。
    #   true  → 会话检索走「2-gram + 向量」两路融合，向量腿故障时自动回退
    #   false → 完全等同改造前：只用 2-gram，不调 embedding、不连 Qdrant
    # 留这个开关是为了"成本/故障时一键止血"：查询侧每次检索都要调一次云端 embedding，
    # 真出问题（额度用尽、Qdrant 挂了）时能关掉，而不是只能改代码重新发版。
    enabled: ${AI_VECTOR_ENABLED:true}

    # 向量腿多取几倍候选，回 MySQL 过滤后再截断（默认 50×3 = 150 条）。
    # 为什么必须多取：向量库与 MySQL 异步同步，检出的 id 里会有
    # "已认领/已删除/被用户排除"的 —— 直接取 topK 再过滤，最后可能连 K 条都不剩。
    overfetch: ${AI_VECTOR_OVERFETCH:3}

    # 分批补齐 / 重建（启动命令，见 VectorBackfillRunner）。
    backfill:
      # 默认关：补齐是按需的一次性动作，不是常驻同步。
      #   启动执行一次：mvn spring-boot:run -Dspring-boot.run.jvmArguments="-Dai.vector.backfill.enabled=true"
      enabled: ${AI_VECTOR_BACKFILL_ENABLED:false}

      # 每批多少条（DB 查询 + upsert 粒度；embedding 内部还会按 batch-size 再切）
      batch-size: ${AI_VECTOR_BACKFILL_BATCH_SIZE:100}

      # true = 忽略"模型+文本指纹"全量重算（换模型重建、或怀疑索引脏了时用）
      force: ${AI_VECTOR_BACKFILL_FORCE:false}

  # 结果筛选策略 —— 两个场景共用同一套召回 + 大模型精排，但**筛选策略必须独立**。
  # 只影响"展示哪些"，不改变召回、不改变模型打分、不改变匹配理由。
  match:

    # ① 主动匹配：用户在 AI 页输入描述，主动来搜。
    interactive:
      # ⚠️ 这里**故意没有最低分**（代码里传 NO_SCORE_FILTER = 0）：
      #    分数是大模型自己写的 0~100 整数，没有被校准过；而且这个场景是"用户主动来找东西"，
      #    多给他看一条、让他自己判断，远比"帮他筛掉"安全 —— 漏报的代价远大于误报。
      #    所以严格按分数降序返回 Top-N，允许 0~5 条。
      #
      # 最多展示几条。prompt 里也写了「最多 5 个」，这里再夹一道是因为
      # **不能把展示条数交给模型自觉**：它哪天返回 8 条，前端就渲染 8 条。
      max-results: ${AI_MATCH_INTERACTIVE_MAX_RESULTS:5}

    # ② 自动匹配：物品发布后由系统自动跑，用于站内通知。
    auto:
      # 总开关。
      #   true  → 发布成功后异步跑匹配，够格就发站内通知
      #   false → 发布照常成功，但**不提交匹配任务、不调用大模型、不产生通知**
      # 留这个开关是为了"成本/故障时可以一键止血"：自动匹配要花钱调模型，
      # 真出问题时能关掉，而不是只能改代码重新发版。
      #
      # ⚠️ 它只影响自动匹配，**完全不影响 AiChat 的主动匹配** —— 两条链路
      #    除了共用召回和精排能力之外没有任何耦合。
      enabled: ${AI_MATCH_AUTO_ENABLED:true}

      # 低于这个分数的结果不进通知。
      #
      # ⚠️ 和主动匹配的区别：通知是**系统推给用户的**，用户没主动要 ——
      #    多推一条就是一次打扰。所以这里需要一道门槛把无关结果压掉。
      #    80 是初始值，不是「80% 的匹配概率」；它的合理区间要靠评测数据定，
      #    而那个分布目前一次都没量过。
      min-score: ${AI_MATCH_AUTO_MIN_SCORE:80}

      max-results: ${AI_MATCH_AUTO_MAX_RESULTS:5}

  # 找物助手会话 —— 第一阶段新增。
  #
  # 和上面的 recall / match 是同一件事的两面：那边管"怎么找"，
  # 这边管"记得住什么、记多久、一次最多花多久"。
  conversation:

    # 整轮时间预算（毫秒）。一轮里最多两次模型调用（先理解、再匹配/解释），
    # 两次各自还有重试 —— 它们**共享**这一份预算，不是各自算各自的。
    # 前端超时是 120 秒：上游必须大于下游最坏耗时，否则会出现
    # "后端还在跑、前端先掐断"，用户看到失败而其实后端成功了。
    turn-budget-ms: ${AI_CONVERSATION_TURN_BUDGET_MS:90000}

    # 会话保留天数。最后一次活动 + 这个天数 = 过期时间，过期即清理。
    # 到期后前端会明确提示重新开始，而不是把一堆用户自己都不记得的条件留着。
    retention-days: ${AI_CONVERSATION_RETENTION_DAYS:7}

    # 带进模型上下文的最近几轮对话。
    # 更早的内容已经沉进摘要了，重复喂进去只是烧 token。
    history-turns: ${AI_CONVERSATION_HISTORY_TURNS:4}

    # 一次最多读回多少条历史消息（刷新恢复页面 + 模型上下文都受它约束）。
    # 至少要能装下 history-turns 轮（每轮 2 条），启动时会校验。
    history-messages: ${AI_CONVERSATION_HISTORY_MESSAGES:50}

    # 过期会话的清理时刻（cron）。默认每天 03:17，刻意避开整点。
    cleanup-cron: ${AI_CONVERSATION_CLEANUP_CRON:0 17 3 * * *}
